# Local stack: PostgreSQL + API (serves the built UI) + separate job worker.
#   docker compose up --build        ->  http://localhost:8000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fittrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fittrace}
      POSTGRES_DB: ${POSTGRES_DB:-fittrace}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fittrace}"]
      interval: 5s
      retries: 20
    ports: ["5432:5432"]

  api:
    build: .
    environment: &env
      FITTRACE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fittrace}:${POSTGRES_PASSWORD:-fittrace}@db:5432/${POSTGRES_DB:-fittrace}
      FITTRACE_DATA_DIR: /data
      FITTRACE_SEED_ON_START: "true"
      FITTRACE_CORS_ORIGINS: '["http://localhost:5173","http://localhost:8000"]'
    volumes: [fitdata:/data]
    depends_on: { db: { condition: service_healthy } }
    ports: ["8000:8000"]

  worker:
    build: .
    command: ["worker"]
    environment:
      <<: *env
      FITTRACE_SEED_ON_START: "false"
    volumes: [fitdata:/data]
    depends_on: { db: { condition: service_healthy } }

volumes:
  pgdata:
  fitdata:
