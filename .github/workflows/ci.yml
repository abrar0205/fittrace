name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: fittrace, POSTGRES_PASSWORD: fittrace, POSTGRES_DB: fittrace_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fittrace" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FITTRACE_TEST_DATABASE_URL: postgresql+psycopg://fittrace:fittrace@localhost:5432/fittrace_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e packages/fittrace -e "apps/api[dev]"
      - name: Lint
        run: ruff check .
      - name: Unit and integration tests (PostgreSQL)
        run: pytest
      - name: OpenAPI contract is up to date
        working-directory: apps/api
        run: |
          python ../../scripts/export_openapi.py
          git diff --exit-code ../../docs/openapi.json

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - name: Generated API types match the OpenAPI contract
        run: npm run gen:api && git diff --exit-code src/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [python, web]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: fittrace, POSTGRES_PASSWORD: fittrace, POSTGRES_DB: fittrace }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fittrace" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FITTRACE_DATABASE_URL: postgresql+psycopg://fittrace:fittrace@localhost:5432/fittrace
      FITTRACE_RUN_WORKER_IN_PROCESS: "true"
      FITTRACE_LOG_JSON: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: pip install -e packages/fittrace -e apps/api
      - name: Migrate and seed (generate, import, measure; benchmarks skipped)
        working-directory: apps/api
        run: alembic upgrade head && python -m app.cli seed-demo --no-benchmarks
      - name: Build web and serve it from the API
        working-directory: apps/web
        run: npm ci && npm run build && npx playwright install --with-deps chromium
      - name: Start API
        working-directory: apps/api
        run: |
          nohup uvicorn app.main:app --port 8000 > ../../api.log 2>&1 &
          for i in $(seq 1 30); do curl -fs localhost:8000/api/v1/health && break; sleep 1; done
      - name: End-to-end workflow
        working-directory: apps/web
        env: { E2E_BASE_URL: "http://localhost:8000" }
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: e2e-artifacts, path: "apps/web/test-results\napi.log" }
